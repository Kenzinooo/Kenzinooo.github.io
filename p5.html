`<script>

function setup() {
  createCanvas(400, 400);
}

function preLoad(){
img1 =loadImage("arrigato.png")
}
function draw() {
  background("#000000");
  fill(0, 204, 100)
  noStroke()
  circle(200, 200, 100)
  fill("#00B5FF")
  stroke("#D40086")
  strokeWeight(5)
  ellipse(160, 160, 40, 60)
  strokeWeight(5)
  ellipse(240, 160, 40, 60)
  fill("#FFE5F5")
  noStroke()
  ellipse(180, 200, 20, 20)
  ellipse(220, 200, 20, 20)
  fill("#19006E")
  ellipse(180, 200, 10, 20)
  ellipse(220, 200, 10, 20)
  line(180, 220, 220, 220)
  image(img1,0,0,400,200);
}
</script>
