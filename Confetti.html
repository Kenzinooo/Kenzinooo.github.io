<!DOCTYPE html>
<html>
<head>
	<style>
		.box{
			width: 30px;
			height: 30px;
			border: 1px solid black;
			display: inline-block;
			position: absolute;
			animation-name: swing3d;
			animation-duration: 3s;
			animation-iteration-count: infinite;
		}

		@keyframes swing3d {
			from { transform: rotateY(-145deg); }
			to   { transform: rotateY(145deg); }
		}

		button {
			position: fixed;
			top: 20px;
			left: 20px;
			padding: 10px 20px;
			font-size: 16px;
			cursor: pointer;
			z-index: 9999;
		}
	</style>
</head>

<body>

<button onclick="dropConfetti()">DROP CONFETTI 🎉</button>

<script>
	let confetti = []
	let falling = false

	function makeConfetti (){
		let square = document.createElement("div")
		square.classList.add("box")
		document.body.appendChild(square)

		let r = Math.random()*255
		let g = Math.random()*255
		let b = Math.random()*255

		let rotation = Math.random() * 360

		square.style.top = Math.random()*150 + "px"
		square.style.left = Math.random()*2000 + "px"
		square.style.width = Math.random()*50 + "px"
		square.style.height = Math.random()*50 + "px"
		square.style.transform = "rotate("+ rotation +"deg)"
		square.style.backgroundColor = `rgb(${r},${g},${b})`

		confetti.push(square)
	}

	function dropConfetti() {
		if (falling) return
		falling = true

		setInterval(() => {
			confetti.forEach(square => {
				let fallFactor = 100
				square.style.top =
					parseInt(square.style.top) + fallFactor + "px"

				if (parseInt(square.style.top) > 1000) {
					square.style.top = Math.random()*150 + "px"
				}
			})
		}, 100)
	}

	// create confetti (but don't drop yet)
	for (let i = 0; i < 67; i++) {
		makeConfetti()
	}
</script>

</body>
</html>
