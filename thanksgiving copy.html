<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
    background-color: black;
}

#backBtn {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: white;
    color: black;
    font-size: 20px;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    z-index: 9999;
}

#bron {
    width: 500px;
    height: 500px;
    position: absolute;
    top: 200px;
    left: 50%;
    transform: translateX(-50%);
    background-image: url("https://i.imgur.com/00X4kLS.gif");
    background-size: cover;
    background-position: center;
    cursor: pointer;
}
</style>
</head>

<body>

<a id="backBtn" href="javascript:history.back()">⬅ Back</a>

<div id="bron"></div>

<audio id="bronAudio">
    <source src="RIP.mp3" type="audio/mpeg">
</audio>

<script>
const bron = document.getElementById("bron");
const audio = document.getElementById("bronAudio");

bron.onclick = function () {
    if (audio.paused) {
        audio.currentTime = 0;
        audio.play();
    } else {
        audio.pause();
    }
};
</script>

</body>
</html>
